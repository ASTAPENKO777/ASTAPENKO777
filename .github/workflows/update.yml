name: Refresh profile

on:
  schedule:
    # 05:20 UTC daily. Deliberately off the hour: GitHub queues cron jobs
    # heavily at :00 and they can be delayed or dropped.
    - cron: "20 5 * * *"
  workflow_dispatch:
  push:
    paths:
      - "data/projects.yml"
      - "scripts/**"
      - ".github/workflows/update.yml"

permissions:
  contents: write

concurrency:
  group: refresh-profile
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Generate README and banners
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/build.py

      - name: Commit if anything actually changed
        run: |
          if git diff --quiet -- README.md assets; then
            echo "No change — nothing to commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets
          git commit -m "Refresh profile stats"
          git push
